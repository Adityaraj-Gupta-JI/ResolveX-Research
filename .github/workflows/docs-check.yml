name: Docs checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check unresolved author placeholders
        shell: bash
        run: |
          if grep -nE \
            'REPLACE_WITH_|\[COPYRIGHT HOLDER\]' \
            LICENSE CITATION.cff; then
            echo "Unresolved author metadata detected."
            exit 1
          fi

      - name: Check committed whitespace errors
        shell: bash
        run: |
          git show --format= --check HEAD